# DataDanış dataset catalog — the hand-checked "semantic layer".
#
# Each dataset is keyed by its azstat table_id. Items are keyed by azstat
# `level_1_id`, because item names repeat inside a table (e.g. "Kişilər"
# appears under births AND deaths). Only items listed here are exposed.
#
# source_url  : the citizen-facing opendata.az page shown under every answer
# data_url    : where scripts/fetch_data.py downloads the snapshot from
# notes       : known traps, kept here so they are not forgotten
#
# Data snapshot fetched 2026-11-01 (see data/cache/manifest.json).

datasets:

  - id: DT_BL_001
    title_az: İstehlak qiymətləri indeksi (inflyasiya), əvvəlki ilə nisbətən
    title_en: Consumer price index (inflation), compared with the previous year
    synonyms: [inflyasiya, qiymətlər, bahalıq, CPI, inflation, prices, инфляция, цены]
    unit_az: faiz (əvvəlki il = 100)
    unit_en: percent (previous year = 100)
    value_kind: index_prev_year_100   # 105.6 means prices rose 5.6%
    slug: consumer-price-index--year-on-year--in-percentage-
    default_item: "001"
    items:
      "001": {az: "Ümumi istehlak qiymətləri indeksi", en: "Consumer price index (all items)"}
      "002": {az: "Ərzaq məhsulları, içkilər, tütün", en: "Food, beverages and tobacco"}
      "004": {az: "Qeyri-ərzaq məhsulları", en: "Non-food products"}
      "006": {az: "Xidmətlər", en: "Services"}

  - id: DT_AA_001
    title_az: Əhalinin sayı (ilin əvvəlinə)
    title_en: Population (at the start of the year)
    synonyms: [əhali, nüfus, neçə nəfər, population, people, население]
    unit_az: min nəfər
    unit_en: thousand people
    value_kind: level
    slug: population--at-the-beginning-of-the-year-
    default_item: "001"
    items:
      "001": {az: "Əhalinin sayı, cəmi", en: "Total population"}
      "002": {az: "Şəhər əhalisi", en: "Urban population"}
      "003": {az: "Kənd əhalisi", en: "Rural population"}
      "004": {az: "Kişilər", en: "Men"}
      "005": {az: "Qadınlar", en: "Women"}

  - id: DT_BK_011
    title_az: Manatın məzənnəsi (illik orta)
    title_en: Manat exchange rate (annual average)
    synonyms: [məzənnə, dollar, avro, rubl, kurs, exchange rate, USD, EUR, курс]
    unit_az: manat
    unit_en: manat
    value_kind: level
    slug: exchange-rate
    default_item: "001"
    items:
      "001": {az: "ABŞ dolları", en: "US dollar"}
      "002": {az: "Avro", en: "Euro"}
      "003": {az: "Rusiya rublu", en: "Russian rouble"}
    notes: Rouble is rounded to 0.01 in the source, so it is too coarse for trends.

  - id: DT_AB_087
    title_az: Məşğulluq və işsizlik (ilin sonuna)
    title_en: Employment and unemployment (end of year)
    synonyms: [işsizlik, iş, məşğulluq, işsiz, unemployment, jobs, employment, безработица]
    unit_az: min nəfər
    unit_en: thousand people
    value_kind: level
    slug: mesgulluq-ve-issizlik-ilin-sonuna-min-nefer
    default_item: "007"
    items:
      "001": {az: "İşçi qüvvəsi", en: "Labour force"}
      "004": {az: "Məşğul əhali", en: "Employed people"}
      "007": {az: "İşsiz əhali", en: "Unemployed people"}
      "008": {az: "İşsiz qadınlar", en: "Unemployed women"}
      "009": {az: "İşsiz kişilər", en: "Unemployed men"}
      "010": {az: "Qeydiyyata alınmış işsizlər", en: "Registered unemployed"}
    notes: Only 2010, 2015 and 2020–2024 exist. Registered unemployed is empty for 2020–2022.

  - id: DT_AB_036
    title_az: Orta aylıq nominal əməkhaqqı (iqtisadi fəaliyyət növləri üzrə)
    title_en: Average monthly nominal wage (by economic activity)
    synonyms: [maaş, əməkhaqqı, əmək haqqı, gəlir, salary, wage, pay, зарплата]
    unit_az: manat
    unit_en: manat
    value_kind: level
    slug: muzdlu-iscilerin-iqtisadi-fealiyyet-ve-mulkiyyet-novleri-uzre-orta-ayliq-nominal-emekhaqqi
    default_item: "001"
    first_row_only: true
    items:
      "001": {az: "Bütün iqtisadiyyat üzrə", en: "Whole economy"}
      "002": {az: "Kənd təsərrüfatı", en: "Agriculture, forestry and fishing"}
      "003": {az: "Mədənçıxarma (neft-qaz)", en: "Mining (oil and gas)"}
      "004": {az: "Emal sənayesi", en: "Manufacturing"}
      "007": {az: "Tikinti", en: "Construction"}
      "008": {az: "Ticarət", en: "Trade"}
      "011": {az: "İnformasiya və rabitə", en: "Information and communication"}
      "012": {az: "Maliyyə və sığorta", en: "Finance and insurance"}
      "016": {az: "Dövlət idarəetməsi", en: "Public administration"}
      "017": {az: "Təhsil", en: "Education"}
      "018": {az: "Səhiyyə", en: "Health care"}
    notes: >
      The JSON drops the ownership dimension, so each sector and year has 3 rows
      (all forms, then two ownership groups). We keep only the first row, which
      matches the published national average (2024 = 1009.4 AZN). Re-check after
      every data refresh.

  - id: DT_CA_008
