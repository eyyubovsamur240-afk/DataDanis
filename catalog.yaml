    title_en: Marriages and divorces
    synonyms: [nikah, toy, evlilik, boşanma, marriage, divorce, брак, развод]
    unit_az: say (əmsallar hər 1000 nəfərə)
    unit_en: count (rates per 1,000 people)
    value_kind: level
    slug: nikah-ve-bosanma-uzre-illik-gostericiler
    default_item: "002"
    items:
      "001": {az: "Nikahların sayı", en: "Number of marriages"}
      "002": {az: "Boşanmaların sayı", en: "Number of divorces"}
      "003": {az: "Nikah əmsalı (hər 1000 nəfərə)", en: "Marriage rate (per 1,000 people)"}
      "004": {az: "Boşanma əmsalı (hər 1000 nəfərə)", en: "Divorce rate (per 1,000 people)"}

  - id: DT_BO_005
    title_az: Qəbul edilmiş və göndərilmiş turistlər
    title_en: Tourists received and sent abroad
