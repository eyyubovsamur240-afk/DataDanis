    items:
      "001": {az: "Cəmi turistlər", en: "All tourists"}
      "002": {az: "Qəbul edilmiş turistlər", en: "Tourists received"}
      "003": {az: "Xaricə göndərilmiş turistlər", en: "Tourists sent abroad"}
    notes: Counts only tourists served by registered travel agencies, not all visitors.

  - id: DT_AI_002
    title_az: Cinayətkarlığın əsas göstəriciləri
    title_en: Main crime indicators
    synonyms: [cinayət, təhlükəsizlik, crime, safety, преступность]
    unit_az: say
    unit_en: count
    value_kind: level
    slug: main-indicators-of-crime-in-azerbaijan
    default_item: "001"
    items:
      "001": {az: "Qeydə alınmış cinayətlər", en: "Registered crimes"}
      "002": {az: "Ağır və xüsusilə ağır cinayətlər", en: "Serious and very serious crimes"}
      "003": {az: "Hər 100 000 nəfərə düşən cinayətlər", en: "Crimes per 100,000 people"}
      "004": {az: "Cinayət törətmiş şəxslər", en: "People who committed crimes"}
    notes: The uploaded CSV on opendata.az is actually the fires table; only the azstat API data is used.
