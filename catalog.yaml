    title_en: Monthly income per person
    synonyms: [gəlir, adambaşına gəlir, pensiya, income, per capita, pension, доход]
    unit_az: manat
    unit_en: manat
    value_kind: level
    slug: monthly-per-capita-income-of-the-population-in-the-country--in-manats
    default_item: "001"
    items:
      "001": {az: "Bütün gəlirlər", en: "Total income"}
      "002": {az: "Muzdlu işdən gəlir", en: "Income from paid work"}
      "003": {az: "Özünüməşğulluqdan gəlir", en: "Income from self-employment"}
      "008": {az: "Pensiyalar", en: "Pensions"}
      "013": {az: "Xaricdən alınan vəsaitlər", en: "Money received from abroad"}

  - id: DT_BA_006
    title_az: ÜDM-in real artım sürəti (əvvəlki ilə nisbətən)
    title_en: Real GDP growth (compared with the previous year)
    synonyms: [ÜDM, iqtisadiyyat, iqtisadi artım, GDP, economy, growth, ВВП]
    unit_az: faiz (əvvəlki il = 100)
    unit_en: percent (previous year = 100)
    value_kind: index_prev_year_100
    slug: gdp-growth-rate-compared-to-the-previous-year--in-percent-
    default_item: "001"
    annual_only: true
    items:
      "001": {az: "ÜDM-in artım sürəti", en: "GDP growth"}
    notes: The table mixes annual, quarterly and monthly rows; only annual (period_type Y) rows are used.

  - id: DT_AA_011
    title_az: Doğulanda gözlənilən ömür uzunluğu
    title_en: Life expectancy at birth
    synonyms: [ömür, ömür uzunluğu, yaşam, life expectancy, how long people live, продолжительность жизни]
    unit_az: il
    unit_en: years
    value_kind: level
    slug: dogulanda-gozlenilen-omur-uzunlugu
    default_item: "001"
    items:
      "001": {az: "Hamısı", en: "Everyone"}
      "002": {az: "Kişilər", en: "Men"}
      "003": {az: "Qadınlar", en: "Women"}

  - id: DT_AA_003
    title_az: Doğulanlar, ölənlər, təbii artım
    title_en: Births, deaths and natural increase
    synonyms: [doğum, doğulan, ölüm, uşaq, körpə ölümü, births, deaths, babies, рождаемость, смертность]
    unit_az: nəfər
    unit_en: people
    value_kind: level
    slug: births--deaths--natural-increase--deaths-of-children-under-1-year-of-age
    default_item: "006"
    items:
      "006": {az: "Doğulanlar", en: "Births"}
      "011": {az: "Ölənlər", en: "Deaths"}
      "001": {az: "Təbii artım", en: "Natural increase (births minus deaths)"}
      "016": {az: "1 yaşadək ölən uşaqlar", en: "Deaths of children under 1"}
      "009": {az: "Doğulan oğlanlar", en: "Boys born"}
      "010": {az: "Doğulan qızlar", en: "Girls born"}

  - id: DT_AA_006
